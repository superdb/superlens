name: Test

# Builds SuperLens with the current main of super and super-ts and tests it,
# on each pull request and merge, and by hand.  SuperLens compiles whatever
# super and super-ts it's given, so a run also fails if a change in either
# one has broken it since the last run.  (The lens.superdb.org deploy runs
# the same steps nightly.)  The browser smoke tests (e2e/) check the built
# site as a host would serve it.

on:
  workflow_dispatch:
    inputs:
      super_ref:
        description: 'superdb/super branch, tag, or SHA to build with'
        default: main
        required: false
      super_ts_ref:
        description: 'superdb/super-ts branch, tag, or SHA to build with'
        default: main
        required: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        path: superlens

    - name: Check out super
      uses: actions/checkout@v4
      with:
        repository: superdb/super
        ref: ${{ inputs.super_ref || 'main' }}
        path: super
        # Tags are needed for the version SuperLens shows.
        fetch-depth: 0

    - name: Check out super-ts
      uses: actions/checkout@v4
      with:
        repository: superdb/super-ts
        ref: ${{ inputs.super_ts_ref || 'main' }}
        path: super-ts

    - uses: actions/setup-go@v6
      with:
        go-version-file: super/go.mod
        cache-dependency-path: super/go.sum

    # The oldest Node that SuperLens supports (see engines in package.json).
    - uses: actions/setup-node@v6
      with:
        node-version: '22.18'

    - name: Install
      working-directory: superlens
      run: npm ci

    # Builds the engine from ../super and the app and super-ts from
    # ../super-ts.  Compiling the app also type checks it.
    - name: Build
      working-directory: superlens
      run: npm run build

    - name: Unit tests
      working-directory: superlens
      run: npm test

    - name: Install the browser for the smoke tests
      working-directory: superlens
      run: npx playwright install --with-deps chromium

    - name: Smoke tests
      working-directory: superlens
      run: npm run test:e2e

    # A failed test is retried once with a trace, which the report includes
    # (npx playwright show-report).
    - name: Save the smoke test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: superlens/playwright-report
        retention-days: 14

    # Runs by hand, e.g., with a super branch, are watched by whoever ran
    # them.
    - name: Inform Slack users of test failures
      uses: tiloio/slack-webhook-action@v1.1.2
      if: failure() && github.ref_name == 'main' && github.event_name != 'workflow_dispatch'
      with:
        slack_web_hook_url: ${{ secrets.SLACK_WEBHOOK_BRIMLABS_TEST }}
        slack_json: |
          {
            "username": "superlens",
            "text": "SuperLens tests failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
